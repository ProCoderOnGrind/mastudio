        - generic [ref=e169]:
          - img "CopenHill image | Bjarke Ingels Group"
        - paragraph [ref=e174]: At the bottom of the ski slope, an après-ski bar welcomes locals and visitors to wind down once the boots are off. Formerly a piece of infrastructure in an industrial zone, CopenHill is now a destination for all citizens and visitors of Copenhagen.
