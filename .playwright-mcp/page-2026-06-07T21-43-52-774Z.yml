        - generic [ref=e113]:
          - paragraph [ref=e114]: Located on the industrial waterfront of Amager, where raw industrial facilities have become the site for extreme sports – from wakeboarding to go-kart racing – the new power plant adds skiing, hiking, and rock climbing to the area. Expert skiers can ski down the artificial Olympic half-pipe length ski slope all year round, test the freestyle park, or try the timed slalom course, while beginners and kids practice on the lower slopes. Skiers ascend the park from the platter lift, carpet lifts, or glass elevator with views inside the 24-hour waste incineration process.
          - paragraph [ref=e115]: CopenHill’s continuous façade features 1.2 m tall and 3.3 m-wide aluminum boxes stacked like gigantic bricks overlapping with each other. In between, glazed windows allow daylight to reach deep inside the facility, while larger openings on the southwest façade illuminate workstations on the administrative floors.
        - generic [ref=e116]:
          - img "CopenHill image | Bjarke Ingels Group"
        - generic [ref=e117]:
          - img "CopenHill image | Bjarke Ingels Group"
        - generic [ref=e119]:
          - img "CopenHill gallery image | Bjarke Ingels Group" [ref=e121]
          - img "CopenHill gallery image | Bjarke Ingels Group" [ref=e123]
        - generic [ref=e127]:
          - paragraph [ref=e128]: The public can enjoy the rooftop bar, cross-fit area, or the highest observation deck in the city before descending the 490 m tree-lined hiking and running trail within the lush, mountainous terrain. The 10,000 m2 green roof, 85 m high up in the air, features a biodiverse landscape while absorbing heat, removing air particulates, and minimizing storm-water runoff.
          - paragraph [ref=e129]: Biologists have monitored the biodiversity of Copenhill since its inauguration in 2019. At the latest investigation in 2020, 119 different new plant and tree species were observed.
        - generic [ref=e131]:
          - img "CopenHill gallery image | Bjarke Ingels Group" [ref=e133]
          - img "CopenHill gallery image | Bjarke Ingels Group" [ref=e135]
        - paragraph [ref=e140]: On the longest vertical façade, an 85 m climbing wall is installed making it the tallest artificial climbing wall in the world.
        - generic [ref=e141]:
          - img "CopenHill image | Bjarke Ingels Group"
        - generic [ref=e142]:
          - img "CopenHill image | Bjarke Ingels Group"
        - generic [ref=e146]:
          - paragraph [ref=e147]: Beneath the slopes, whirring furnaces, steam, and turbines convert 440,000 tons of waste annually into enough clean energy to deliver electricity and district heating for 150,000 homes. The power plant’s infrastructure, from ventilation shafts to air-intakes, helps create the varied topography of a mountain; a man-made landscape created in the encounter between the needs from below and the desires from above.
          - paragraph [ref=e148]: Ten floors of administrative space are occupied by the Amager Resource Center team, including a 600 m2 education center for academic tours, workshops and sustainability conferences.
        - generic [ref=e150]:
          - img "CopenHill gallery image | Bjarke Ingels Group" [ref=e152]
          - img "CopenHill gallery image | Bjarke Ingels Group" [ref=e154]
