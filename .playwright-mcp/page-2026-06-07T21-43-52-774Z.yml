      - generic [ref=e57]:
        - generic [ref=e61]:
          - paragraph [ref=e62]: Located in an industrial area near Copenhagen city center, CopenHill, also known as Amager Bakke, is an exemplary model in the field of waste management and energy production, as well as an architectural landmark in the cityscape of Copenhagen. The building replaces the 50-year-old Amagerforbraending plant and is the single largest environmental initiative in Denmark.
          - paragraph [ref=e63]: The new breed of waste-to-energy plant is topped with a ski slope, hiking trail, climbing wall, an urban recreation center, and environmental education hub, turning the power plant into a destination. The building embodies BIG’s notion of hedonistic sustainability while contributing to Copenhagen’s goal of becoming one of the world’s first carbon-neutral cities.
        - generic [ref=e64]:
          - img "CopenHill image | Bjarke Ingels Group"
        - generic [ref=e65]:
          - generic [ref=e66]:
            - generic [ref=e67]:
              - img "CopenHill gallery image | Bjarke Ingels Group" [ref=e68]
              - paragraph [ref=e69]:
                - strong [ref=e70]: PROGRAM —
                - text: Without sacrificing efficiency, BIG was able to organize the volumetric organization of the machinery inside the plant from tallest to shortest.
            - generic [ref=e71]:
              - img "CopenHill gallery image | Bjarke Ingels Group" [ref=e72]
              - paragraph [ref=e73]:
                - strong [ref=e74]: FUN FACTORY —
                - text: BIG proposed a new breed of waste-to-energy plant, one that is economically, environmentally and socially profitable.
            - generic [ref=e75]:
              - img "CopenHill gallery image | Bjarke Ingels Group" [ref=e76]
              - paragraph [ref=e77]:
                - strong [ref=e78]: FACADE —
                - text: The building is gently wrapped with a continuous façade made out of stacked aluminum bricks. The openings between them are letting cascades of light into the deep process hall and the administration spaces.
            - generic [ref=e79]:
              - img "CopenHill gallery image | Bjarke Ingels Group" [ref=e80]
              - paragraph [ref=e81]:
                - strong [ref=e82]: PLANTERS —
                - text: In time, the bricks on the facade can function as planters, creating a green façade and turning the building into a green mountain from afar.
            - generic [ref=e83]:
              - img "CopenHill gallery image | Bjarke Ingels Group" [ref=e84]
              - paragraph [ref=e85]:
                - strong [ref=e86]: ALPINE SKIING IN COPENHAGEN —
                - text: BIG proposed to turn the roof of the new plant into an artificial, year-round ski slope for the citizens of Copenhagen.
            - generic [ref=e87]:
              - img "CopenHill gallery image | Bjarke Ingels Group" [ref=e88]
              - paragraph [ref=e89]:
                - strong [ref=e90]: THREE PISTS —
                - text: The geometry of the roofscape supports three slopes of different gradients with a total of 500 m of ski runs and a terrain park. This accommodates beginner and pro skiers.
            - generic [ref=e91]:
              - img "CopenHill gallery image | Bjarke Ingels Group" [ref=e92]
              - paragraph [ref=e93]:
                - strong [ref=e94]: SLOPE ACCESS —
                - text: Access to the ski paths is through an elevator adjacent to the smokestack. The elevator has a glass wall facing the interior of the plant, allowing recreational buffs and sightseers to have a glimpse into the internal workings of the plant.
            - generic [ref=e95]:
              - img "CopenHill gallery image | Bjarke Ingels Group" [ref=e96]
              - paragraph [ref=e97]:
                - strong [ref=e98]: TAKE A WALK IN THE PARK —
                - text: The roof doesn't only function as a ski slope, but like a real mountain with green forest areas, hike trail and climbing walls. The top of the slope invites visitors to enjoy a café and 360 views from the viewing platform.
            - generic [ref=e99]:
              - img "CopenHill gallery image | Bjarke Ingels Group" [ref=e100]
              - paragraph [ref=e101]:
                - strong [ref=e102]: COPENHILL —
                - text: Rather than a traditional visitor center, people come on their own for skiing and hiking, and become curious about what happens inside the mountain.
