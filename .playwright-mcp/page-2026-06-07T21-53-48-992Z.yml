      - generic [ref=e209]:
        - heading "DESIGN PROCESS" [level=2] [ref=e210]
        - paragraph [ref=e211]:
          - text: There is no monopoly on creativity at BIG. When we come up with ideas, we try to be as uncritical as possible during conception and when we edit, we apply immense rigor. Anyone can come up with the idea and it doesn't matter where or who the idea comes from - what matters is why you choose it.
          - text: "Our design process is best described through Darwin's evolutionary theory. As life evolves, so should our cities and buildings. Darwin's famous evolutionary tree from the 'Origin of Species' could practically be a diagram of how we work: our architecture evolves through generations of design meetings in process of excess and selection - many ideas are born and only the ones that live long enough to pollinate, pass on their attributes to the next design meeting."
