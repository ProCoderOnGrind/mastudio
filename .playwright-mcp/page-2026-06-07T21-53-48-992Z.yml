          - text: Our journey started in Copenhagen in 2005, followed by an office in NYC in 2010, London in 2016, Barcelona in 2019 and most recently Shenzhen. We have completed more than 60 buildings in 10+ countries and never limit ourselves to a specific region – we go where our projects are.
          - text: Over the last two decades, we have grown organically to a 700+ person family worldwide. Working on new projects, typologies and challenges – we are joined by new BIGsters with the skills, experience and expertise our projects need. Join our team!
