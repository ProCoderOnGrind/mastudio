          - img "ANNOUNCING BIG ATLAS, COMING APRIL 2026 | Bjarke Ingels Group" [ref=e726]
          - generic [ref=e727]:
            - heading "ANNOUNCING BIG ATLAS, COMING APRIL 2026" [level=2] [ref=e728]
            - generic [ref=e730]:
              - paragraph [ref=e731]: BIG’s new monograph, BIG Atlas, published by Phaidon, is now available for pre-order and will be released globally this April. Showcasing over 50 projects, BIG Atlas takes readers on a two-decade journey through BIG’s built work through a collection of 600+ photographs, plans, and drawings. The monograph opens with a foreword by Danish architect Kent Martinussen, followed by an introduction by British architect and critic Joseph Grima, as well as an essay by Icelandic writer Andri Snær Magnason.
              - paragraph [ref=e732]:
                - emphasis [ref=e733]: “Our first book, Yes is More, had to navigate the dilemma that we had all the ideas in the world, but almost no built evidence to back it up. Hot to Cold attempted to portray a practice responding to an ever-greater cultural variety and climatic diversity. Formgiving reported from the past, present, and future of how things take shape and are given form. All of these books were our miniature manifestations of where we were in our evolution as an architecture practice, and as such, the format became as much the content as the work itself.
              - paragraph [ref=e734]:
                - emphasis [ref=e735]: When Phaidon approached us with the idea to create a book that looks at our total oeuvre, I immediately liked the idea – where the architecture is allowed to speak for itself, where I was not the voice, where we were not the authors, and where only the built work was presented as evidence of the kind of world we have attempted to materialize through the last quarter century. The result is a book where the radicality of the work is contrasted by the classicism of the presentation. Structured chronologically, it doesn’t present the failed attempts or the missed opportunities, but rather the built result of two and a half decades of architectural practice. The Danish word for design – formgivning – literally means giving form to the future. Turning our vision of the world into concrete reality. Turning fiction into fact. And by allowing the form of the book to be as classic as possible, it is my hope that the content will be able to stand out in its full physical form and manifest reality. Ironically, due to the slow-moving nature of architecture, it also means that the book is almost chemically cleansed of the work on our desktops, hard drives, and model workshops of the last few years. It is taking the long perspective of an architectural practice’s slow journey – a journey of decades rather than years.”
                - strong [ref=e736]: – Bjarke Ingels, Founder & Creative Director, BIG
              - link "phaidon.com" [ref=e737] [cursor=pointer]:
                - /url: https://www.phaidon.com/en-int/products/big-atlas?variant=47539247448164
                - text: phaidon.com
