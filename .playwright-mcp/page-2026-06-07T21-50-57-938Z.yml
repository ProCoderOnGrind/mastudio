          - img "BIG, WILLIAM RAWN, AND HASTINGS UNVEIL DESIGN FOR NEW TENNESSEE PERFORMING ARTS CENTER | Bjarke Ingels Group" [ref=e210]
          - generic [ref=e211]:
            - heading "BIG, WILLIAM RAWN, AND HASTINGS UNVEIL DESIGN FOR NEW TENNESSEE PERFORMING ARTS CENTER" [level=2] [ref=e212]
            - generic [ref=e214]:
              - paragraph [ref=e215]: Neighboring Cumberland Park and Nissan Stadium, the new home of the Tennessee Performing Arts Center (TPAC) – designed by BIG and William Rawn Associates with HASTINGS Architecture – extends the vibrancy of downtown Nashville across the Cumberland River, emerging as a cultural anchor for the city’s reenergized East Bank. Supporting a range of artistic programming, the new TPAC includes four performance spaces clustered at its core – the multi-function Grand Broadway theater; a dance and opera hall; a flexible black box theater; and an intimate cabaret space – as well as rehearsal studios and classrooms. As TPAC transitions from its current location downtown, the 307,000-sq-ft center will become the home of the Nashville Ballet, Nashville Opera, and Nashville Repertory Theatre while creating venues for traveling Broadway shows, dance performances, and community events. Construction is expected to begin in 2027, with a projected opening in 2030.
              - paragraph [ref=e216]:
                - emphasis [ref=e217]: “The new home for the Tennessee Performing Arts Center is designed like an urban and cultural connection – between the east and west bank of the Cumberland River, between the old and the new Nashville, and between all of the performing arts. Visually, it bookends Broadway as a beacon from across the river, drawing the cultural life of downtown across to the East Bank. Designed to be welcoming on all sides, the center is accessible from above and below the bridge, making the lobby a cascading public space for the daily life of the neighborhood. The façade is composed of aluminum tubes bundled like organ pipes or steel chimes, undulating from vertical to horizontal to provide openings and canopies for the audience and performers passing through. The result is like a flowing public pavilion in the park that, as the new home for TPAC, provides the inclusive and inviting character that its program and performances deserve.”
                - strong [ref=e218]: – Bjarke Ingels, Founder & Creative Director, BIG
