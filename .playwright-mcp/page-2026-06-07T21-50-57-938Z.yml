              - paragraph [ref=e781]: Emerging from the U.S. Department of Housing and Urban Development’s Rebuild by Design competition in the wake of Superstorm Sandy, ESCR is designed to protect and improve the resiliency of 110,000 New Yorkers and critical infrastructure. The 2.25-mile project area includes elevated parks, flood barrier walls and gates, and a system of “bridging berms” to help protect the adjacent neighborhood from future storm surge and rising sea levels.
