            - paragraph [ref=e1047]:
              - paragraph [ref=e1048]: The concrete structure of Irmahus in Aarhus, Denmark, has now officially reached its highest point, marking a major milestone for the 37,000 m² mixed-use development. When completed, the building will offer workspaces, a hotel and spa, and restaurants across its 19 stories. Wrapping around the exterior, a public staircase will give both users and visitors access to expansive views of the city and harbor, making Irmahus a new destination along the waterfront. It also marks the final addition to the BIG-designed masterplan for Aarhus Ø, concluding more than a decade of development in the area.
        - article [ref=e1049]:
          - generic [ref=e1050]: 10.11.2025
          - img "THE FINAL ISSUE OF DOMUS GUEST EDITED BY BJARKE INGELS IS OUT | Bjarke Ingels Group" [ref=e1052]
          - generic [ref=e1053]:
            - heading "THE FINAL ISSUE OF DOMUS GUEST EDITED BY BJARKE INGELS IS OUT" [level=2] [ref=e1054]
            - generic [ref=e1056]:
              - paragraph [ref=e1057]: The tenth and final issue of Domus guest edited by Bjarke Ingels is out, concluding our material odyssey with “Immaterial – Manifesting the Intangible”. As the antithesis to the year, the issue turns to design untethered by a material medium, exploring the non-matter forces that influence our built environments.
              - paragraph [ref=e1058]: Tobias Rees opens the issue with an exploration of quantum computing and consciousness, while David Sheldon-Hicks looks at how the future is mapped through the great fictions of the big screen. Olafur Eliasson discusses making light, color, temperature, and natural phenomena materially tangible, and Matt Shaw describes the Sphere as a final state of architecture, where surfaces are overtaken by ephemeral content.
              - paragraph [ref=e1059]: AquaPraça by Höweler + Yoon and Carlo Ratti Associati materializes rising water levels as a floating public square, and Fran Silvestre’s Camiral House blurs fiction and fact, its anti-tectonic form matching the immateriality of its abstract renders. Carlos Bañón and Daeho Lee explore the aesthetic potential of AI as a source of authorship, while Nendo minimizes material use to its physical limits. TeamLab creates immersive, inhabitable animations, Reuben Wu draws cathedrals of time and light with drones, and Gaël McGill and Evan Ingersoll reveal the mechanical complexity inside living cells. Studio Drift’s Lonneke Gordijn and Ralph Nauta explores the interplay of freedom and control, artificial nature and weightless mass.
              - link "domusweb.it" [ref=e1060] [cursor=pointer]:
