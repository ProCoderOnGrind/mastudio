          - img "DOMUS PUBLISHES &#8220;RECYCLATE &#8211; FROM TRASH TO TREASURE&#8221; UNDER BJARKE INGELS&#8217; GUEST EDITORSHIP | Bjarke Ingels Group" [ref=e1279]
          - generic [ref=e1280]:
            - heading "DOMUS PUBLISHES “RECYCLATE – FROM TRASH TO TREASURE” UNDER BJARKE INGELS’ GUEST EDITORSHIP" [level=2] [ref=e1281]
            - generic [ref=e1283]:
              - paragraph [ref=e1284]: In “Recyclate – From Trash to Treasure”, the October issue of Domus guest edited by Bjarke Ingels, we look to the remains of our built world as the resources of the future.
              - paragraph [ref=e1285]: Aaron Betsky makes a case for repurposing rather than building anew, while Anders Lendager looks to the existing built environment as a source of new materials. Olaf Grawert challenges the culture of demolition, and Lacaton & Vassal treat reuse as an act of generosity, extending the life and freedom of what already exists.
              - paragraph [ref=e1286]: Pihlmann Architects transform a 1960s factory in Copenhagen, while Blaising Borchardt Studio gives significance to old rails in their Holocaust memorial. Maxence Grangeot reuses rubble in Cyclopean concrete, and Dirk van der Kooij merges waste plastics into new metamorphic forms. Material Record and Yamaha explore the aesthetics of upcycling with their speakers and guitars. Thomas Deininger scavenges the debris of beaches and parks to celebrate nature with the very waste that threatens it – and creates the cover for this issue, assembling pieces of plastic into an abstract composition of color and waste. Thomas Dambo builds mythological trolls from construction scraps, while Kathleen Ryan turns trash into treasure with her bejewelled still lifes, inspiring the title of this issue.
              - link "domusweb.it" [ref=e1287] [cursor=pointer]:
