            - generic [ref=e328]:
              - paragraph [ref=e329]: NOT A HOTEL has opened its newest property, NOT A HOTEL Setouchi, on Japan’s remote island of Sagishima. Designed by BIG, the resort is carved into the 30,000-m2 site’s mountainous terrain, surrounded by the Seto Inland Sea. The four-bedroom villas and beach terrace restaurant – named ’90,’ ‘180’, ‘270,’ and ‘360’ depending on location and corresponding views – are made of soil directly from the site using the traditional rammed earth technique.
              - paragraph [ref=e330]:
                - emphasis [ref=e331]: “NOT A HOTEL Setouchi are our first completed buildings in Japan, a culture that has had a profound impact on myself and my understanding of architecture; a place where fearless Futurism and deep traditional roots coexist in contrasting harmony. It has been an absolute architectural adventure to work with NOT A HOTEL to make this vision come to life.
              - paragraph [ref=e332]:
                - emphasis [ref=e333]: The archipelago around Sagishima is like a Japanese landscape painting. Steep rolling hills covered in lush green vegetation erupt from the tranquility of the Seto Inland Sea. The four pavilions are conceived as extensions of the dramatic topography. Hilltops and peninsulas, outcroppings and canyons are outlined by rammed earth walls and solar roofs to provide pavilions with 360-, 270-, 180-, and 90-degree views of the surrounding scenery. On one hand, each home is like an inhabited view, open and extroverted. On the other, their spinal walls outline a private and protected space – open only to the sky. Macrocosmos meets microcosmos, traditional meets modern; Scandinavian and Japanese, the villas are architectural oxymorons embodying seemingly contradictory elements into a holistic hospitable whole.”
