              - paragraph [ref=e1569]: Diriyah Company has announced the launch of The Chedi Residences Wadi Safar, designed by BIG and developed in partnership with Chedi Hospitality. Set within the cliffs of the Wadi Safar district in Diriyah, Saudi Arabia, The Chedi Residences Wadi Safar is a collection of 20 branded villas featuring 16 four- and five-bedroom villas, as well as four five-bedroom premium villas. The residences showcase Najdi-inspired architecture integrated into the natural landscape, offering privacy, harmony, and uninterrupted views over the Greg Norman-designed Signature Golf Course.
              - paragraph [ref=e1570]: Residents will have access to a full suite of amenities, including access to the forthcoming adjacent 85-key Chedi hotel, signature dining, wellness and fitness facilities, curated retail, and a private residents’ club featuring a lounge, business corner, and event spaces.
