            - generic [ref=e1218]:
              - paragraph [ref=e1219]: The Marengo Multimodal Transport Hub in Toulouse, France, has received its building permit, marking a new step in the development of the 12,000 m² project located next to Gare Matabiau. The six-storey building will bring together bus, rail, metro, cycling, and pedestrian networks under one roof. A rose-colored crystalline roof, referencing the city’s traditional “foraine” brick, rises to 32 m towards the railway tracks. Public areas are planned to extend across the ground floor and two sub-levels, hosting retail, rest spaces, cultural activities, and the Maison du Climat. A 1,000-place bicycle station will be integrated into the site, while the upper floors provide offices for the Occitanie Region.
              - paragraph [ref=e1220]: Construction is scheduled to begin in summer 2026 and finish at the end of 2028, to align with the launch of metro line C and precede the arrival of the Toulouse–Bordeaux high-speed rail line.
