            - heading "HER MAJESTY QUEEN MARGRETHE OF DENMARK PRESENTED WITH BIG’S VISION FOR THE NEW SANKT LUKAS HOSPICE & LUKASHUSET" [level=2] [ref=e85]
            - generic [ref=e87]:
              - paragraph [ref=e88]: "Her Majesty Queen Margrethe of Denmark visited the Sankt Lukas Foundation and to get insight into the Foundation’s hospice services and ambitions connected to the new hospice buildings designed by BIG and Creo Arkitekter. The new 8,500 m² palliative care center will house an outreach hospice team, Denmark’s first day hospice, and units for children, youth, and adults. With plans to care for approximately 2,100 patients annually, the two structures will more than triple current capacity, creating an environment guided by three core principles: safety and sense of home, solitude and togetherness, and arrival and farewell. Her Majesty Queen Margrethe has been patron of the Sankt Lukas Foundation since 2001, when she assumed the patronage from Queen Ingrid, continuing a royal connection that dates back to 1934."
