            - generic [ref=e1584]:
              - paragraph [ref=e1585]: Quito, Ecuador continues its rise as a global design destination, with new towers by international architects reshaping the city’s skyline. Vogue highlights how the city’s blend of contemporary architecture, a UNESCO-listed historic core, and vibrant creative neighborhoods is turning the Andean capital into South America’s next design hotspot.
              - paragraph [ref=e1586]: The article features IQON, a 130-m-tall tower designed by BIG with an architectural identity defined by its ‘stripped back’ façade; the raw, exposed concrete simultaneously functions as the building’s structure. Individual ‘pixels’ are stacked and rotated to provide the best possible views while simultaneously creating terraces for the apartments. Celebrating native trees and plants, the building integrates greenery wherever possible to take advantage of Ecuador’s temperate climate and ecology – the country with the most plant species per square meter in the world.
