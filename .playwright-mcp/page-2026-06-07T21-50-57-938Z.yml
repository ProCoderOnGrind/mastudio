              - paragraph [ref=e835]: Suzhou Museum of Contemporary Art has been awarded Silver in the “Best Cultural, Sports and Education Project” category at the MIPIM Asia Awards 2025, which celebrate sustainable, visionary, and community-focused architecture. The awards recognize projects for their overall sustainability, integration with the environment and community, quality of the user experience, economic contribution, originality of concept, and architectural qualities. Suzhou Museum of Contemporary Art, located on Jinji Lake and covering 60,000 m², offers a modern interpretation of the garden elements that have defined Suzhou’s urbanism, architecture, and landscape for centuries. Clad in rippled and curved glass and stainless steel, the façades reflect the surrounding sky, water, and gardens, while 12 interconnected pavilions beneath a continuous, ribbon-like roof guide visitors through a sequence of gardens and courtyards, intertwining art, history, nature, and water.
