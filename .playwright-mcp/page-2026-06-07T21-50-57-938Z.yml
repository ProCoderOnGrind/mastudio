          - generic [ref=e1297]:
            - heading "BIG WINS COMPETITION TO DESIGN NEW CONGRESS CENTER IN ROUEN, FRANCE" [level=2] [ref=e1298]
            - generic [ref=e1300]:
              - paragraph [ref=e1301]: BIG has won the international competition to design a new congress center in Rouen, France. On the banks of the Seine, the 11,500 m² building, nicknamed ‘The Sail,’ is defined by its roofline that rises and dips above the river. The congress center is envisioned as a public meeting place that links the city to the water while hosting international events, exhibitions and community life.
