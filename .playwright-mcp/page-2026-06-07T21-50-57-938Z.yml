              - paragraph [ref=e1253]: Vogue Scandinavia Living launches its debut issue with BIG’s Founder and Creative Director, Bjarke Ingels, on the cover. The feature takes readers inside his 1918 summerhouse in Rørvig, Denmark – a red pinewood cottage named Fjordglimt (“a glimpse of the fjord”) that blends Danish tradition with Swedish craftsmanship. In the article, Bjarke reflects on how the historic home has become both a family sanctuary and a source of creative inspiration, influencing his architectural work and approach to restoration.
