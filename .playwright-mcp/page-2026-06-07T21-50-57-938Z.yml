            - heading "BIG UNVEILS EVE MUSIC HALL AS CONSTRUCTION NEARS COMPLETION IN EASTERN CROATIA" [level=2] [ref=e16]
            - generic [ref=e18]:
              - paragraph [ref=e19]: BIG unveiled the vision for EVE Music Hall during an event on site in eastern Croatia, where guests were invited to experience the building in progress and attend a special live performance by pianist Peter Bence. Expected to open in early 2027, EVE Music Hall is BIG’s first project in Croatia and is set to become the studio’s first completed music performance venue.
              - paragraph [ref=e20]: The 10,000-m² venue will center on a live music venue, but also feature congress facilities, exhibition spaces, a café, and rooftop for events. Set among the agricultural landscapes of Slavonia, the building is composed of two distinct halls connected by a shared public foyer. Clad in slabs of local limestone, the facade drape toward the ground like theatrical curtains, framing entrances and revealing glimpses of the activity within, while suspended timber beams and mirrored surfaces shape the atmosphere of the interior.
              - paragraph [ref=e21]: “The EVE Music Hall is conceived as a musical eruption on the infinite horizon of the Slavonian fields. Two concert halls, one big and one small, frame a public space between them. Facades of timber and stone are draped like fabrics, merging the verticality of the halls with the horizontality of the landscape. Slits in the stone curtains open up, inviting visitors to enter and explore. The main foyer is framed by the two mirror-clad walls of the concert halls, repeating the tent-like timber roof at infinity. The architectural whole is both functional and fantastical, like an architectural manifestation of utopian pragmatism. It is an embodiment of the almost oxymoronic contradiction of the bold ambition to build a regional cultural destination in the middle of the Slavonian countryside.” – Bjarke Ingels, Founder & Creative Director, BIG
