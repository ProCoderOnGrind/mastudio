            - generic [ref=e552]:
              - paragraph [ref=e553]: Situated on the site of a decommissioned power plant, Manresa Wilds will reimagine the industrial peninsula in Norwalk, Connecticut into a 125-acre park with nearly two miles of newly accessible shoreline, restored forests, and coastal habitats. Shaped by a year of engagement sessions, the final vision incorporates the desires of over 3,000 Norwalk residents, neighborhood groups, local businesses, educators, and civic leaders for a more natural landscape; a design that respects the surrounding neighborhoods and local wildlife; and dedicated spaces for gathering and learning.
              - paragraph [ref=e554]: Adaptively reusing the existing structures, BIG’s design reimagines the 1960s power plant at the heart of the site into over 200,000 sq ft of vibrant, flexible spaces for events, learning, and play – including a community pool, dedicated areas for research, and a park-level restaurant and cafe.
              - paragraph [ref=e555]:
                - emphasis [ref=e556]: “This project allows a majestic mid-century power plant to be reborn as a community hub for the collective life and leisure of the people of Norwalk. Rather than demolition, we are adapting its monumental spaces into free and flexible public spaces that extend the vision of the park inside, making it accessible and enjoyable year-round. Adaptive reuse at this scale is rare, and Manresa Wilds can be a blueprint for communities looking to transform decommissioned industrial sites into vibrant possibilities for public life.”
