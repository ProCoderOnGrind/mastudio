            - generic [ref=e67]:
              - paragraph [ref=e68]:
                - paragraph [ref=e69]: AIANY and the New York chapter of the American Society of Landscape Architects (ASLA) have awarded the East Side Coastal Resiliency (ESCR) project the Transportation + Infrastructure Design Excellence Award. This awards program recognizes built and unbuilt projects for their design, innovation, and impact – raising awareness about the critical role that well-designed infrastructure plays in our cities, our communities, and our lives.
              - paragraph [ref=e70]:
                - paragraph [ref=e71]: Designed and developed under the leadership of the New York City Department of Design and Construction in collaboration with MNLA, One Architecture & Urbanism, AKRF, Lower East Side residents, and others, ESCR emerged from the U.S. Department of Housing and Urban Development’s Rebuild by Design competition. Designed to protect over 110,000 New Yorkers from future storms while strengthening the neighborhood’s connection to the East River, the ribbon of revitalized parkland along Manhattan’s east side combines flood protection such as barrier walls and sliding gates with amenities such as sports courts, grassy lawns, an open-air amphitheater, and pedestrian bridges.
              - paragraph [ref=e72]:
                - paragraph [ref=e73]: Large sections, including Stuyvesant Cove Park and the first phase of East River Park, are now open. The next phase of the project is slated to open in 2027.
