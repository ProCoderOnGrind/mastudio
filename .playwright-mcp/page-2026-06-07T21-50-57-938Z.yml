            - heading "ALDAR LAUNCHES THE ROW SAADIYAT IN ABU DHABI’S CULTURAL DISTRICT" [level=2] [ref=e1182]
            - generic [ref=e1184]:
              - paragraph [ref=e1185]: Aldar Properties has announced The Row Saadiyat, a lifestyle and residential quarter designed by BIG with interiors by Kettle Collective. Located in Abu Dhabi’s Saadiyat Cultural District – within walking distance of the Zayed National Museum, the Louvre Abu Dhabi, the Guggenheim, and upcoming Natural History Museum – The Row Saadiyat comprises seven residential buildings arranged around a central linear spine. This spine creates a seamless visual and spatial connection between a mosque at one end and the Zayed National Museum on the other, offering residents unobstructed vistas that celebrate the district’s cultural icons.
              - paragraph [ref=e1186]: Combining vibrant street life with calm, private spaces above, The Row Saadiyat’s ground floors will host dining, wellness, and lifestyle outlets, while amenities include kids’ clubs, a pet spa, a co-working lounge, and a wellbeing club open to residents and the wider community. The mosque, also designed by BIG, blends Emirati vernacular with Saadiyat’s contemporary architecture, featuring a prayer hall that aligns with Mecca and an upper form that orients toward the Zayed Museum. A spiraling ramp connects these elements, creating a fully accessible roofscape and marking the first mosque of its kind inspired by the Malwiya form.
              - paragraph [ref=e1187]: The first phase of sales for 315 one- to three-bedroom homes in The Row Saadiyat opens on November 1st.
