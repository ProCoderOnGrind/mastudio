                - generic [ref=e200]: As part of Interni Magazine’s city-wide exhibition MATERIAE held during Salone del Mobile in Milan, BIG unveiled ‘Light Knot Progression’ – a continuous light installation at the Università degli Studi di Milano’s historic main campus. Spanning 30 m in length and constructed with 280 m of luminous profile, the work traces an unbroken line that crosses eleven arches, forming a sequence of nodes that grow in complexity as they progress. Realized with Italian light manufacturer Artemide, the collaboration marks over 10 years of partnership and reflects the design process as a journey interweaving relationships, ideas, and developments.
